eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

grpc:
  client:
    collector:
      address: 'discovery:///collector'
      negotiation-type: plaintext
    analyzer:
      address: 'discover://analyzer'
      negotiation-type: plaintext

spring:
  application:
    name: event-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server


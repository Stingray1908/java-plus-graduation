spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      server:
        native:
          search-locations:
            - classpath:config/core/{application}
            - classpath:config/ewm-stats-service/{application}
            - classpath:config/infra
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 0



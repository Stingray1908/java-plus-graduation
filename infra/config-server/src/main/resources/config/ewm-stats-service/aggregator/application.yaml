server:
  port: 0

kafka:
  bootstrap-server: localhost:9092
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1
  consumer:
    group-id: aggregator-group
    auto-offset-reset: earliest
    enable-auto-commit: false
    key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
    value-deserializer: ru.yandex.practicum.config.UserActionAvroDeserializer
  producer:
    key-serializer: org.apache.kafka.common.serialization.LongSerializer
    value-serializer: ru.yandex.practicum.config.BaseAvroSerializer

logging:
  level:
    root: INFO
    ru.yandex.practicum: INFO
    org.springframework.kafka: INFO
    org.apache.kafka.clients: INFO
    org.apache.kafka.common: INFO
    org.springframework.kafka.listener: INFO

server:
  port: 0

grpc:
  server:
    port: 0

kafka:
  consumer:
    bootstrap-servers: localhost:9092
    auto-offset-reset: earliest
    enable-auto-commit: false
    similarity-group-id: analyzer-similarity
    actions-group-id: analyzer-actions
    key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
    event-similarity-deserializer: ru.yandex.practicum.config.EventSimilarityAvroDeserializer
    user-action-deserializer: ru.yandex.practicum.config.UserActionAvroDeserializer
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1

logging:
  level:
    root: INFO
    ru.yandex.practicum: INFO
    org.springframework.kafka: INFO
    org.apache.kafka.clients: INFO
    org.apache.kafka.common: INFO
    org.springframework.kafka.listener: INFO

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password

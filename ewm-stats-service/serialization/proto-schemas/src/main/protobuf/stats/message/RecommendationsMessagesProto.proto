syntax = "proto3";

package stats.message;  // <-- важно: отдельный пакет для сообщений

option java_package = "ru.yandex.practicum.grpc.recommendation";
option java_outer_classname = "RecommendationsMessagesProto";
option java_multiple_files = true;

message UserPredictionsRequestProto {
  int64 user_id = 1;
  int32 max_results = 2;
}

message SimilarEventsRequestProto {
  int64 event_id = 1;
  int64 user_id = 2;
  int32 max_results = 3;
}

message InteractionsCountRequestProto {
  repeated int64 event_id = 1;
}

message RecommendedEventResponse {
  int64 event_id = 1;
  double score = 2;
}

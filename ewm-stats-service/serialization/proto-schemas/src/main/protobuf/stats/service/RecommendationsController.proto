syntax = "proto3";

package stats.service.dashboard;

option java_package = "ru.yandex.practicum.grpc.recommendation";
option java_outer_classname = "RecommendationsServiceProto";
option java_multiple_files = true;

import "stats/message/RecommendationsMessagesProto.proto";  // путь относительно src/main/protobuf

service RecommendationsController {
  rpc GetRecommendationsForUser(stats.message.UserPredictionsRequestProto)
      returns (stream stats.message.RecommendedEventResponse);

  rpc GetSimilarEvents(stats.message.SimilarEventsRequestProto)
      returns (stream stats.message.RecommendedEventResponse);

  rpc GetInteractionsCount(stats.message.InteractionsCountRequestProto)
      returns (stream stats.message.RecommendedEventResponse);
}
